[project]
name = "pool-break-lab"
version = "0.1.0"
description = "Pipeline de datos sobre millones de quiebres de pool simulados"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pooltool-billiards==0.6.0",
    "numpy",
    "pyarrow",
    "dbt-duckdb==1.11.1",
    "dagster==1.13.30",
    "dagster-dbt==0.29.30",
    "pyyaml",
    # dbt exige protobuf<7; sin este límite pip instala la 7 y dbt falla
    "protobuf<7",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "dagster-webserver==1.13.30"]

[project.scripts]
pool-break = "pool_break_lab.run_batch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
