[project]
name = "pool-match-lab"
version = "0.1.0"
description = "Analista de partidas de pool: del video grabado a estadísticas de cada tiro"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pooltool-billiards==0.6.0",
    "numpy",
    "pyarrow",
    "opencv-python-headless==5.1.0.95",
    "dbt-duckdb==1.11.1",
    "dagster==1.13.30",
    "dagster-dbt==0.29.30",
    "pyyaml",
    "streamlit==1.67.0",
    "plotly==7.1.0",
    # dbt exige protobuf<7; sin este límite pip instala la 7 y dbt falla
    "protobuf<7",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "dagster-webserver==1.13.30"]

[project.scripts]
pool-break = "pool_match_lab.run_batch:main"
pool-synthetic = "pool_match_lab.synthetic:main"
pool-analyze = "pool_match_lab.shots:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
